name: Cleanup npm bootstrap versions

# Temporary, manual-only workflow to remove the bootstrap 0.0.0 versions and
# dist-tag once 1.0.0 has been published with trusted publishing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Remove bootstrap version and tag
        run: |
          npm dist-tag rm @wc-toolkit/angular-wrappers bootstrap || true
          npm unpublish @wc-toolkit/angular-wrappers@0.0.0-stage --force || true
          npm unpublish @wc-toolkit/angular-wrappers@0.0.0 --force || true
          npm view @wc-toolkit/angular-wrappers versions dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
